# Cheeky - 7.5 s. Nothing is modified; the common pipeline is the whole recipe.
#
# The clip is a TROT/BOUNCE and that is what blocks it, not any defect we can fix
# upstream. Measured on the canonical reference:
#
#   support        only 2 paws on the floor for most of the clip, and they are a
#                  DIAGONAL pair (fr+bl, then br+fl) - the same pattern Ashley
#                  authored (her contact schedule reads 0110 then 1001 over frames
#                  26-32). Balancing on a diagonal line has no roll support.
#   static         CoM inside the support on 103/180 frames = 57%
#   wrench         contact-wrench feasible on 83/180 = 46%; 39 frames need a
#                  friction coefficient above the ground plane's 0.5, 20 need mu>1
#   held poses     stage4/hold_frame.py, 3 s each: frames 0, 60, 90 and 120 are
#                  clean static equilibria (joint error <=0.003 rad, 4/4 contacts,
#                  tilt within 9 deg). Frames 30 and 150 are NOT - held perfectly
#                  still they topple in 22 and 14 frames, with 0.4-0.7 of 4 paws
#                  down. The reference contains poses that cannot be held at all.
#
# Everything tried, and what it measured:
#   wrench_refine cap 20/40/60 mm ..... 44% -> 54%/52%/51%; a body offset cannot
#                                       fix a required friction of 13
#   auto_retime x1.6, 3 rounds ........ 44% -> 46% while inflating the clip 217%.
#                                       Slowing REMOVES the momentum that carries a
#                                       trot through its unstable phase
#   ground friction 0.5 -> 1.0 ........ fall frame 40 -> 39 (no effect)
#   settle 120 physics steps first .... fall 40 -> 58, root error 462 -> 698 mm
#   stance_polish ..................... reference slip 2.05 -> 1.33 mm/frame,
#                                       fall 90 -> 40
#   segment restarts (0-59, 45-104,
#     90-149, 130-179, each from its
#     own exact reference state) ...... every segment falls within 23-45 frames,
#                                       so it is not accumulated drift either
#
# A trot is a closed-loop gait. This one is Stage 5's, and the reference is now as
# good as Stage 2 can make it (slip 2.05 mm/frame, 100% of planted paws on the
# floor, contact schedule 99.9% matched, Stage 3 exact).
