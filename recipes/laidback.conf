# Laidback - 20 s. Bingo stands and gestures for 11.7 s, then turns 90 deg and
# walks off. Nothing is modified: the common pipeline (solve -> ground -> stance
# polish) is enough, and every deviation tried made it worse.
#
# MEASURED, so it is not re-litigated:
#
#   frames 0-280 (11.7 s, 58% of the clip) execute cleanly open-loop -
#   root position error 36 mm mean / 139 mm max, root ORIENTATION error 5.2 deg
#   mean / 24 deg max, 3.53 of 4 paws in contact, no fall (stage4/subclip.py
#   --range 0-280 then rl/tools/track_v4_physics.py).
#
#   frames 275-284 are an authored TROT: only the br+fl diagonal pair is on the
#   floor, for 10 consecutive frames, with a CoM margin of -0.2 to -4.7 mm. That is
#   a balance-on-a-line pose. Run from the exact reference state at frame 270 the
#   robot still rolls off it: +15 deg of roll by frame 280, +51 deg by 287, fall at
#   286. It is not a momentum problem and not a reference-feasibility problem.
#
# Rejected, with the measurement:
#   local retime of 275-355 x2 and x3 ....... falls at the SAME frame; the pose
#                                             sequence, not the speed, is the issue
#   wrench_refine (cap 30 mm, margin 8 mm) .. 89% -> 95% wrench-feasible, fall
#                                             286 -> 290, and it buried 52 frames
#                                             up to 12.6 mm through the floor
#   force all 4 paws planted over 272-292 ... fall 286 -> 313, but root position
#                                             error 355 -> 546 mm: the feet have to
#                                             slide to turn and physics will not
#                                             let them, so the turn is lost anyway
#
# The trot-turn needs closed-loop balance (Stage 5). Damaging it to buy 27 more
# frames of survival is the trade this project explicitly refuses.
