# DeadPan - 15.7 s standing performance with a big head shake and a rear-up.
# Nothing is modified. The common pipeline is the whole recipe.
#
# THE WRENCH PASS WAS ADOPTED AND THEN WITHDRAWN, and the reason is worth keeping.
# stage4/wrench_refine.py + stage4/reik_root.py took the reference from 93% to 99%
# contact-wrench feasible and the physics root position error from 171 to 124 mm,
# which read as a clear win. Watching the .blend showed the hind legs SHAKING for the
# first three seconds. Measured: reik_root solved every frame independently, so
# wherever the body offset changed it hopped between IK solutions - the hind knees'
# jerk p99 over frames 0-80 went from 64-72 rad/s^3 before the pass to 2353-3528
# after it, and peak leg velocity reached 11.4 rad/s, past the URDF's own 10 rad/s
# limit. reik_root now carries a temporal continuity term (--w-cont, default 40) and
# forward/backward sweeps, which fixes the shake (jerk back to ~190, peak velocity
# 8.3 rad/s) - and with the chatter gone the benefit evaporates:
#
#   variant                 root pos err   fall   hind-knee jerk p99 (f0-80)
#   no wrench pass ........  171 mm        227          64
#   wrench + old reik .....  124 mm        216        3528   <- shakes
#   wrench + smooth reik ..  267 mm        191         197
#
# The 124 mm was bought by a chattering leg trajectory, not by better posture. So:
# no wrench pass here. (Eccentric still uses it - its offset is 2.3 mm rather than
# 4.4 mm, its reik chatter was mild, and its later stance polish smooths what is
# left.)
#
# WHAT ACTUALLY BLOCKS IT is in STAGE2_4_HANDOFF.md: ten short DIAGONAL two-paw
# windows totalling 30 frames (8% of the clip). Frames 0-185 and 300-375 execute
# open-loop with no fall (50 mm / 7.6 deg and 28 mm / 7.2 deg); the middle does not.
# stage4/extend_stance.py is the most promising unadopted lever - see the handoff.

# SELF-COLLISION IN THE OPENING SIT. The pipeline constrains the floor and the joint
# limits and nothing else, so the sit folds the shanks up into the chest: measured
# against the true torso hull, a shank is inside it on 143 of 376 frames, up to
# 22.0 mm deep, in windows 0-102 and 340-375. The walking section is clean apart from
# two 2-frame blips. Nothing downstream noticed - PhysX runs with self-collision off,
# the balance audits only look at what touches z=0, and every joint limit is
# satisfied. The pose is legal and visibly wrong.
#
# stage2/uncollide.py re-solves only the affected legs on only the affected frames,
# holding the grounded paw to its world contact point, keeping the ankle and the
# incoming pose, and fading the correction in and out over 4 frames.
#   --w-contact 1200 is the balance point between the two things that fight here:
#      w-contact  400 -> 4 frames left, but a grounded paw moves up to 131 mm
#      w-contact 1200 -> 10 frames left, paw held to 1.9 mm mean / 25.6 mm max
#      w-contact 3000 -> 70 frames left, paw held to 0.9 mm mean
#   --max-change 20 deg keeps it LOCAL. Without a bound the solver flips the knee to
#      the other branch (84.4 deg) - that clears the torso and destroys the sit.
#      Raising it to 30 deg does not help: the residual is geometric, not a lack of
#      joint freedom.
# Result, measured against the exact hull: 143 -> 10 frames (38% -> 3%), the rest in
# three short windows (0-2, 53-57, 374-375) where the paw cannot be held AND the
# shank cleared at the same time. Leg joints move 1.8 deg mean.
UNCOLLIDE=0
UNCOLLIDE_ARGS="--w-contact 1200 --max-change 20 --only 0,112;330,375"
