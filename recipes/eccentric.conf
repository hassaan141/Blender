# Eccentric - authored SIT: Bingo rocks back onto its haunches (body pitch -47 to
# -78 deg) and glides forward 1.878 m over 15.4 s.
#
# Three measured impossibilities, and the smallest fix for each.
#
# 1. NO ROLL SUPPORT. Ashley holds both hind paws 57-82 mm off the floor for all
#    370 frames, so the retarget rests on the rear EDGE of the torso hull - a line
#    contact, 51 cm^2, CoM margin -1.8 mm. Physics rolls it over by frame 36 every
#    time, and no CoM placement fixes a line contact. Planting the two hind shanks
#    turns it into a 312 cm^2 polygon: 100% statically AND wrench-feasible.
#    Cost: leg joints move 5.6 deg mean / 26.3 deg max from the authored pose.
#    Only the hind pair is forced - the front paws keep Ashley's step schedule.
#    Only the hind pair is forced by height - the front paws are handled below.
#
# 1b. THE FRONT PAWS DRAG, AND THE DETECTOR HID IT. Bingo shuffles forward by
#    dragging both front paws along the floor. stage2/detect_contacts.py marks a paw
#    planted only when it is LOW *and* SLOW - correct for deciding a world anchor,
#    wrong for deciding what touches the ground - so a paw travelling at ~230 mm/s
#    with its toe 5 mm off the floor is filed as SWING. Measured on Ashley: her front
#    toes are within 10.8 mm of her floor on 73% and 77% of frames; the schedule
#    reported 25% and 25%. The retarget duly left them in the air, and the body slid
#    forward with nothing touching it - which is exactly what it looked like.
#    stage2/drag_windows.py recovers those windows (48-52% of the clip per paw,
#    mean 0.95 units/frame while dragging) and they are forced down too. Result: the
#    front paws are now on the floor 73-76% of frames, against Ashley's 73-77%, and
#    the support polygon goes from 96 to 336 cm^2.
DRAG=$(python3 stage2/drag_windows.py --keypoints stage2/out/eccentric_source.npz \
        --contacts stage2/out/eccentric_contacts.npz --band 0.05 --legs fl,fr \
        | tail -1 | sed 's/--force-planted //;s/"//g')
GROUND_ARGS="--force-planted 0,369:bl,br;$DRAG"
#
# 2. CoP still grazed the hull edge on 5 frames. wrench_refine finds the smallest
#    body offset that keeps the centre of pressure 20 mm inside the support:
#    2.3 mm mean, 10.9 mm max. reik_root then re-solves the legs so no paw moves
#    (planted paws held to 0.22 mm mean).
WRENCH=1
WRENCH_ARGS="--cap 0.02 --margin 0.02"
#
# 3. THE TRAVEL IS REAL, THE PROPULSION IS NOT ENOUGH. Ashley's body travels
#    1.878 m and the front paws genuinely PADDLE to do it - measured on her source,
#    while a front toe is touching it moves BACKWARD (the propulsive direction) on
#    42% and 52% of those frames, and net it advances at only 35-38% of the body's
#    speed. The v4 retarget reproduces that faithfully: toe backward on 49% and 52%
#    of touching frames, advancing at 29-38% of body speed. So this is NOT the
#    unsupported glide an earlier version of this file claimed - that claim came from
#    reading the speed-gated contact schedule instead of the toe heights, and it was
#    wrong.
#
#    What Bingo cannot do is make it MOVE anything. In this pose the torso is flat on
#    the floor carrying most of the 2.46 kg, so the body's own sliding friction
#    resists more than two lightly-loaded front paws can generate. Demonstrated by
#    sweeping the ground friction, the only term that changes that balance:
#
#        ground friction   0.50    0.30    0.15
#        travel achieved      9%     13%     16%   (of Ashley's 1.878 m)
#
#    Monotonic and nowhere near 100%, exactly as a torso-drag limit predicts. The
#    reference keeps the full travel and the ~890 mm of root position error is
#    reported as a physical impossibility rather than hidden by deleting the motion.
#    Everything else tracks: no fall in 555 frames, root ORIENTATION error 9.9 deg,
#    3.40 of 4 paws in contact, joint error 0.0137 rad.
#
#    Deleting the travel was tried and reverted - it buys root position 890 -> 79 mm
#    and lets stance_polish run (orientation 16.9 -> 9.3 deg), but Bingo then performs
#    the whole rock without going anywhere, which is the first thing anyone notices.
#      NOGLIDE=1                     <- deliberately not set
#      POLISH=1 POLISH_STAGE=noglide <- only works with the glide removed
#
# 5. THE HEAD FLICKS WHERE IT CANNOT FOLLOW. Ashley sweeps the head 506 deg over her
#    frames 129-231 (robot 193-346), reaching 179 deg from rest - a near-full roll.
#    The v4 head chain cannot go near that: head_pitch -37..+3, head_yaw +-34,
#    head_roll +-45 deg. Pinned against those stops, the orientation IK has several
#    almost-equally-bad minima and hopped between them, producing a 34.8 deg
#    SINGLE-FRAME flick and back - which reads as a glitch rather than as a joint
#    limit. Capping how fast the head and tail may cross their workspace removes it:
#
#        head/tail rate cap   8.0 (default)   4.0    2.5    2.0    1.5
#        max single-frame head step   34.8    19.1   12.0    9.6    7.1 deg
#        frames stepping > 8 deg        14      17      8      4      0
#
#    At 1.5 rad/s the flick is gone and the cost is small: gaze yaw fidelity 15.46 ->
#    15.81 deg, gaze elevation 6.35 -> 9.13. --ear-vel stays at 8.0 so the EARS are
#    untouched - they track Ashley well and are the one expressive chain that does.
#    Their fidelity in fact improves slightly (earL elevation 33.9 -> 30.0) because
#    the head they hang off is no longer snapping.
#    This is per-clip: DeadPan's head shake is a genuine 7.8 rad/s gesture and must
#    NOT be slowed.
# 6. IT LOOKED LIKE IT WAS SCOOTING DIAGONALLY. It is - and so does Ashley. Her body
#    faces 27.0 deg off her own direction of travel for the whole clip and the v4
#    retarget reproduces that to 0.2 deg; both paths are dead straight (Ashley
#    deviates 3 mm from a straight line over 1978 mm, the retarget 17 mm over
#    1877 mm). What differed was only the WORLD frame: her travel happens to lie
#    along her -Y axis, while the default alignment (frame-0 heading -> +X) left ours
#    running 27.9 deg across the Blender grid. --yaw-align travel rotates the export
#    by -28.1 deg so the net travel runs along +X. It is a rigid yaw about Z with
#    gravity along Z, so nothing physical changes - the ankle IK error is identical
#    to the millimetre - it just reads correctly on the grid.
SOLVE_ARGS="--expr-vel 1.5"
#
# 6. IT LOOKED LIKE IT WAS SCOOTING DIAGONALLY. It is, and so does Ashley: her body
#    faces 27.0 deg off her own direction of travel for the whole clip and the v4
#    retarget reproduces that to 0.2 deg. Both paths are straight (Ashley deviates
#    3 mm from a straight line over 1978 mm, the retarget 17 mm over 1877 mm). What
#    differed was only the WORLD frame - her travel lies along her -Y axis, while the
#    export's frame-0-heading alignment left ours running 27.9 deg across the grid.
#    stage4/yaw_align.py rotates the FINISHED clip about Z so the travel runs along
#    +X. Root pose only; every joint angle is bit-identical, so the head, ears, tail
#    and legs are untouched.
#    Do NOT do this by rotating the solver's axis alignment A instead: A also appears
#    in the expressive-chain target construction (C = A @ Rbody[0]), so rotating it
#    silently rewrites the head and ears - measured, the legs moved <0.001 rad but ear
#    pitch moved 2.42 rad and the physics run went from completing to falling at
#    frame 52. That is a latent solver bug (the head delta is expressed in the world
#    frame at frame 0 rather than in the body frame); this pass sidesteps it.
YAW_ALIGN=x
#
RETIME=1.5
